databaseChangeLog:
  - changeSet:
      id: 001-create-senders
      author: virak
      changes:
        - createTable:
            tableName: senders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(150)

              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: country_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: senders
            columnNames: email
            constraintName: uk_senders_email
