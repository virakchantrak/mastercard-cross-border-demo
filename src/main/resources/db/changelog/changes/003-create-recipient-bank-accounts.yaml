databaseChangeLog:
  - changeSet:
      id: 003-create-recipient-bank-accounts
      author: virak
      changes:
        - createTable:
            tableName: recipient_bank_accounts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: bank_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: bank_code
                  type: VARCHAR(50)
              - column:
                  name: account_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: account_holder_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: recipient_bank_accounts
            baseColumnNames: recipient_id
            referencedTableName: recipients
            referencedColumnNames: id
            constraintName: fk_bank_accounts_recipient

        - createIndex:
            tableName: recipient_bank_accounts
            indexName: idx_bank_accounts_recipient_id
            columns:
              - column:
                  name: recipient_id
