databaseChangeLog:
  - changeSet:
      id: 005-create-payments
      author: virak
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sender_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: recipient_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: bank_account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quote_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: sender_id
            referencedTableName: senders
            referencedColumnNames: id
            constraintName: fk_payments_sender

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: recipient_id
            referencedTableName: recipients
            referencedColumnNames: id
            constraintName: fk_payments_recipient

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: bank_account_id
            referencedTableName: recipient_bank_accounts
            referencedColumnNames: id
            constraintName: fk_payments_bank_account

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: quote_id
            referencedTableName: quotes
            referencedColumnNames: id
            constraintName: fk_payments_quote
